<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAP KING | LIVE COMMAND FL</title>
    <style>
        :root {
            --bg: #050505;
            --panel: #111;
            --border: #222;
            --text: #eee;
            --text-dim: #666;
            --accent: #22c55e; /* Live Green */
            --warning: #fbbf24; /* Odds Gold */
            --danger: #ef4444; /* High Gap Red */
            --info: #3b82f6; /* Model Blue */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            padding: 10px;
            line-height: 1.2;
        }

        /* Top Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }
        .brand { font-weight: 900; letter-spacing: 1px; color: var(--text); }
        .brand span { color: var(--danger); }
        
        #refresh-btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            transition: all 0.2s;
        }
        #refresh-btn:hover { background: #333; border-color: var(--accent); }

        /* Table Design */
        .table-container {
            background: var(--panel);
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { 
            background: #1a1a1a; 
            color: var(--text-dim); 
            text-align: left; 
            padding: 12px 8px; 
            text-transform: uppercase; 
            font-size: 10px;
            letter-spacing: 0.5px;
        }
        td { padding: 12px 8px; border-bottom: 1px solid var(--border); }

        /* Cell Styling */
        .team-cell { font-weight: 800; font-size: 13px; }
        .live-tag { color: var(--accent); font-size: 9px; margin-left: 4px; vertical-align: middle; }
        .score { font-family: monospace; font-size: 14px; color: var(--text-dim); }
        .prob { color: var(--info); font-weight: 600; }
        .odds { color: var(--warning); font-weight: 600; }
        
        /* Gap Highlighting */
        .gap-pill {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 900;
            background: #222;
        }
        .gap-alert { background: var(--danger); color: white; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .status-text { font-size: 10px; color: var(--text-dim); }
    </style>
</head>
<body>

<header>
    <div class="brand">GAP<span>KING</span> <small style="font-size: 9px; font-weight: normal; color: #444;">| HARD ROCK FL</small></div>
    <div id="status-area">
        <span id="api-status" class="status-text">SYSTEM IDLE</span>
        <span id="last-update" class="status-text" style="margin: 0 15px;">--:--:--</span>
        <button id="refresh-btn">MANUAL PULL</button>
    </div>
</header>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th width="20%">Matchup (Value Team)</th>
                <th width="10%">Score</th>
                <th width="12%">MLB Prob</th>
                <th width="12%">HR Prob</th>
                <th width="12%">Gap %</th>
                <th width="12%">HR Odds</th>
                <th width="12%">Model Line</th>
            </tr>
        </thead>
        <tbody id="grid-body">
            <tr><td colspan="7" style="text-align:center; padding:40px; color:#444;">INITIALIZING COMMAND CENTER...</td></tr>
        </tbody>
    </table>
</div>

<audio id="alarm" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
/** CONFIGURATION **/
const API_KEY = "25bafa02832145bbfc9cce3e84332668";
const PROXY = "https://green-hat-0844.nomarbosox5.workers.dev/?url=";
const BOOKIE = "hardrockbet"; // The-Odds-API key for Hard Rock
const MIN_GAP = 8.0; 

/** UTILITIES **/
const normalize = (n) => String(n).toLowerCase().replace(/[^a-z]/g, '');
const amToProb = (odds) => {
    const n = Number(odds);
    return n < 0 ? (Math.abs(n)/(Math.abs(n)+100))*100 : (100/(n+100))*100;
};
const probToAm = (p) => {
    if (p >= 99) return "-10000";
    if (p <= 1) return "+10000";
    return p >= 50 ? Math.round(-100*(p/(100-p))) : "+" + Math.round(100*((100-p)/p));
};

async function fetchData() {
    const status = document.getElementById("api-status");
    status.innerText = "API: FETCHING...";
    
    try {
        const oddsUrl = `${PROXY}${encodeURIComponent(`https://api.the-odds-api.com/v4/sports/baseball_mlb/odds/?apiKey=${API_KEY}&bookmakers=${BOOKIE}&oddsFormat=american`)}`;
        const schedUrl = `${PROXY}${encodeURIComponent(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&hydrate=linescore`)}`;

        const [oRes, sRes] = await Promise.all([fetch(oddsUrl), fetch(schedUrl)]);
        const oddsData = await oRes.json();
        const schedData = await sRes.json();

        const games = schedData.dates?.[0]?.games || [];
        const livePromises = games.map(g => fetch(`${PROXY}${encodeURIComponent(`https://statsapi.mlb.com/api/v1.1/game/${g.gamePk}/feed/live`)}`).then(r => r.json()).catch(() => null));
        const liveFeeds = await Promise.all(livePromises);

        processGrid(games, liveFeeds, oddsData);
        status.innerText = "API: LIVE";
        document.getElementById("last-update").innerText = new Date().toLocaleTimeString();
    } catch (e) {
        console.error(e);
        status.innerText = "API: ERROR";
    }
}

function processGrid(games, feeds, odds) {
    const body = document.getElementById("grid-body");
    let rows = [];
    let triggerAlarm = false;

    games.forEach((g, idx) => {
        const feed = feeds[idx];
        const homeName = g.teams.home.team.name;
        const awayName = g.teams.away.team.name;
        
        // 1. Get Model Probability
        const homeWp = feed?.liveData?.plays?.currentPlay?.about?.homeWinProbability 
                    ?? feed?.liveData?.linescore?.teams?.home?.winProbability 
                    ?? null;
        if (homeWp === null) return;
        const awayWp = 100 - homeWp;

        // 2. Find Hard Rock Odds
        const gameOdds = odds.find(o => normalize(o.home_team) === normalize(homeName));
        const market = gameOdds?.bookmakers?.[0]?.markets?.[0];
        if (!market) return;

        const hOutcome = market.outcomes.find(o => normalize(o.name) === normalize(homeName));
        const aOutcome = market.outcomes.find(o => normalize(o.name) === normalize(awayName));

        if (!hOutcome || !aOutcome) return;

        // 3. Calculate Gaps for both
        const hGap = homeWp - amToProb(hOutcome.price);
        const aGap = awayWp - amToProb(aOutcome.price);

        // 4. Determine which side has more value
        const bestSide = hGap >= aGap ? {
            name: homeName.split(' ').pop(),
            matchup: `${awayName.split(' ').pop()} @ ${homeName.split(' ').pop()}`,
            model: homeWp,
            book: amToProb(hOutcome.price),
            gap: hGap,
            odds: hOutcome.price
        } : {
            name: awayName.split(' ').pop(),
            matchup: `${awayName.split(' ').pop()} @ ${homeName.split(' ').pop()}`,
            model: awayWp,
            book: amToProb(aOutcome.price),
            gap: aGap,
            odds: aOutcome.price
        };

        if (bestSide.gap >= MIN_GAP) triggerAlarm = true;

        rows.push({
            ...bestSide,
            score: `${g.teams.away.score || 0}-${g.teams.home.score || 0}`,
            isLive: g.status.abstractGameState === "Live"
        });
    });

    rows.sort((a, b) => b.gap - a.gap);

    body.innerHTML = rows.map(r => `
        <tr>
            <td>
                <span class="team-cell">${r.name}</span><br>
                <small style="color:#444">${r.matchup}</small>
                ${r.isLive ? '<span class="live-tag">● LIVE</span>' : ''}
            </td>
            <td class="score">${r.score}</td>
            <td class="prob">${r.model.toFixed(1)}%</td>
            <td>${r.book.toFixed(1)}%</td>
            <td>
                <span class="gap-pill ${r.gap >= MIN_GAP ? 'gap-alert' : ''}">
                    ${r.gap.toFixed(1)}%
                </span>
            </td>
            <td class="odds">${r.odds > 0 ? '+' + r.odds : r.odds}</td>
            <td style="color:var(--text-dim)">${probToAm(r.model)}</td>
        </tr>
    `).join('') || `<tr><td colspan="7" style="text-align:center; padding:20px; color:#444;">NO ACTIVE GAMES FOUND</td></tr>`;

    if (triggerAlarm) document.getElementById("alarm").play().catch(() => {});
}

// Initialization
document.getElementById("refresh-btn").onclick = fetchData;
document.body.addEventListener('click', () => { console.log("Audio Unlocked"); }, {once: true});
setInterval(fetchData, 60000);
fetchData();

</script>
</body>
</html>
